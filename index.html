 class="panel on" id="roster"><div class="hero"><small>LIVE UFC DATABASE</small><h1>Every active fighter.</h1><p>Photos, records, physicals and career performance stats in a phone-first fighter hub.</p><div class="count"><div><b id="nf">—</b><span>active</span></div><div><b id="nd">—</b><span>divisions</span></div><div><b id="ns">—</b><span>with stats</span></div></div></div><div id="error"></div><div class="search"><input id="q" placeholder="Search fighter, gym, style…"><select id="sort"><option value="wins">Wins</option><option value="name">Name</option><option value="slpm">SLpM</option><option value="td">TD avg</option></select></div><div id="chips" class="chips"></div><div id="grid" class="grid"><div class="msg">Loading UFC roster…</div></div></section><section class="panel" id="lab"><div class="hero"><small>FIGHT LAB</small><h1>Compare fighters.</h1><p>Put any two active fighters side-by-side.</p></div><div class="pickrow"><button class="pick" id="pickA"><b>Choose fighter</b></button><div class="vs">VS</div><button class="pick" id="pickB"><b>Choose fighter</b></button></div><div id="cmp"></div></section></main><nav class="nav"><button class="on" data-tab="roster"><span>◫</span>Roster</button><button data-tab="lab"><span>⚔</span>Fight Lab</button></nav><div class="modal" id="pm"><article class="sheet"><button class="close" id="pc">×</button><div id="profile"></div></article></div><div class="modal" id="picker"><article class="sheet"><button class="close" id="kc">×</button><div class="body"><input id="pq" placeholder="Search fighter…" style="width:100%;height:44px;border:1px solid #29313b;border-radius:12px;background:#12161c;color:#fff;padding:0 12px"><div class="list" id="plist"></div></div></article></div><script>const API='https://api.octagon-api.com/fighters',CSV='https://raw.githubusercontent.com/benyamindsmith/fightr/main/data/ufcstats_data.csv';const S={all:[],div:'All',A:null,B:null,target:'A'};const $=s=>document.querySelector(s),$$=s=>[...document.quer
