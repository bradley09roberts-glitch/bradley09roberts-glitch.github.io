# TerraCraft Radiance
# The sky, sun, moon, stars and clouds are drawn by the pack.
clouds=off
sun=false
moon=false
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
dynamicHandLight=true
separateAo=false
frustum.culling=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

# water writes its normal/material untouched
blend.gbuffers_water.colortex1=off
blend.gbuffers_hand_water.colortex1=off

screen=<profile> <empty> [LIGHTING] [SKY] [WATER] [POST]
screen.LIGHTING=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation EMISSIVE_STRENGTH VOLUMETRIC_LIGHT VL_STEPS VL_STRENGTH WAVING_PLANTS
screen.SKY=CLOUDS CLOUD_COVERAGE CLOUD_HEIGHT FOG_DENSITY
screen.WATER=WATER_REFLECTIONS
screen.POST=EXPOSURE SATURATION BLOOM_STRENGTH VIGNETTE

sliders=shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation EMISSIVE_STRENGTH VL_STEPS VL_STRENGTH CLOUD_COVERAGE CLOUD_HEIGHT FOG_DENSITY EXPOSURE SATURATION BLOOM_STRENGTH VIGNETTE

profile.MEDIUM=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=16 VL_STEPS=16
profile.HIGH=shadowMapResolution=4096 shadowDistance=160.0 SHADOW_SAMPLES=24 VL_STEPS=32
profile.ULTRA=shadowMapResolution=8192 shadowDistance=224.0 SHADOW_SAMPLES=48 VL_STEPS=48
profile.EXTREME=shadowMapResolution=8192 shadowDistance=320.0 SHADOW_SAMPLES=48 VL_STEPS=64
