plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            // ./gradlew runClient -Pautojoin : join a local dedicated server as "Dev" (automated testing).
            if (providers.gradleProperty('autojoin').isPresent()) {
                gameDirectory = project.file('run-client')
                programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev')
            }
            // ./gradlew runClient -Pworld=<save folder> : open a singleplayer world from run-client/saves.
            if (providers.gradleProperty('world').isPresent()) {
                gameDirectory = project.file('run-client')
                programArguments.addAll('--quickPlaySingleplayer', providers.gradleProperty('world').get(), '--username', 'Dev')
            }
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

def resourceProps = [
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    minecraft_version_range: minecraft_version_range,
    neo_version_range      : neo_version_range,
    loader_version_range   : loader_version_range,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(resourceProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(resourceProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation' << '-Xmaxerrs' << '2000'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
}
