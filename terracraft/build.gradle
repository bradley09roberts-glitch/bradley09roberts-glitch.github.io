plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client') {
            // ./gradlew runClient -Pautojoin : join a local dedicated server as "Dev" (automated testing).
            if (providers.gradleProperty('autojoin').isPresent()) {
                workingDir = layout.projectDirectory.dir('run-client')
                args '--quickPlayMultiplayer', 'localhost:25565', '--username', 'Dev'
            }
            // ./gradlew runClient -Pworld=<save folder> : open a singleplayer world from run-client/saves.
            if (providers.gradleProperty('world').isPresent()) {
                workingDir = layout.projectDirectory.dir('run-client')
                args '--quickPlaySingleplayer', providers.gradleProperty('world').get(), '--username', 'Dev'
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            workingDir = layout.projectDirectory.dir('run-gametest')
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

def resourceProps = [
    mod_id               : mod_id,
    mod_name             : mod_name,
    mod_version          : mod_version,
    mod_authors          : mod_authors,
    minecraft_version_range: minecraft_version_range,
    forge_version_range  : forge_version_range,
    loader_version_range : loader_version_range,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(resourceProps)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(resourceProps)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
}
