// Starforged - a Minecraft Forge mod for Minecraft 26.2 / Forge 65.1.0 (Java 25)
// Based on the official Forge 26.2-65.1.0 MDK.

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = mod_version
group = 'com.starforged'

base {
    archivesName = 'starforged'
}

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'starforged'
        }

        register('client') {
            // Optional: ./gradlew runClient -PquickPlay=localhost joins a server straight away (handy for testing).
            if (project.hasProperty('quickPlay')) {
                args '--quickPlayMultiplayer', project.property('quickPlay')
            }
        }

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'starforged', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
            'Specification-Title'     : 'starforged',
            'Specification-Vendor'    : 'Starforged',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Starforged',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Starforged'
        ])
    }
}
