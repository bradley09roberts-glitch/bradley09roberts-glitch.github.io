# Grand Line Shaders - dimension folders (Iris syntax: dimension.<folder> = <namespace:path> [more ids...]; * = fallback)
# With this file present Iris resolves no dimension by itself, so every folder is listed explicitly.

# the ocean world (and the fallback for any dimension not listed here)
dimension.world0 = minecraft:overworld *
dimension.world-1 = minecraft:the_nether
dimension.world1 = minecraft:the_end

# Grand Line Odyssey dimensions
dimension.sky = grandline:sky
# the deep sea's registry id is grandline:deep_sea (grandline:deep is mapped too, in case it is ever renamed)
dimension.deep = grandline:deep_sea grandline:deep
dimension.interior = grandline:ship_interiors
