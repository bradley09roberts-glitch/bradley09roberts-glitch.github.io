# Grand Line Shaders - block material groups (Iris block.properties, read through mc_Entity.x)
#
# Format: block.<id> = <namespace:block[:state=value]> ...   One line per id: a second line with the same id REPLACES
# the first, so always append to the existing line (a trailing backslash continues a line).
# Groups: 10 water, 11 lava, 20 leaves, 21 small plants, 22/23 two-block plants (lower/upper), 24 vines,
#         25 underwater plants, 26 stacked plants, 30 glass, 31 stained glass, 32 ice, 33 bubble membrane,
#         34 slime/honey, 40 metal, 41 plaster/painted, 42 wood, 43 cloth, 44 hanging cloth (sways only with the
#         CLOTH_SWAY option), 45 polished stone, 46 sand, 47 stone, 48 snow, 49 roof tiles, 50 fully glowing,
#         51 light sources (bright pixels glow), 52 fire, 53 portal, 54 glowing lantern shades, 60 cloud,
#         61 seastone, 62 poneglyph.
# Unlisted blocks are plain matte surfaces and never move. Only groups 20-26 (and 44 with CLOTH_SWAY) move.
# Blocks that emit light but are not listed still glow on their brightest pixels (Iris passes the block's light level).

