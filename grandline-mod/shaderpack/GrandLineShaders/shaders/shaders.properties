# Grand Line Shaders - pack properties (Iris / OptiFine shader pack format)

# ---------------------------------------------------------------- rendering behaviour
oldLighting = false
# vertex colour alpha carries vanilla ambient occlusion, applied to ambient light only
separateAo = true
underwaterOverlay = false
vignette = false
# particles are drawn after the deferred pass and shaded forward
particles.ordering = after
beacon.beam.depth = true
rain.depth = false

# vanilla clouds only when "Vanilla, restyled" is chosen; the painted clouds live in the sky shader
#if CLOUD_MODE == 1
clouds = fancy
#else
clouds = off
#endif

# Water / translucent data buffers are written without blending (the nearest translucent surface wins)
blend.gbuffers_water.colortex3 = off
blend.gbuffers_water.colortex6 = off
blend.gbuffers_hand_water.colortex3 = off
blend.gbuffers_hand_water.colortex6 = off
# normals and material data of entities, block entities and the hand are never blended
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off

# bloom tiles are only built when bloom is on
program.composite1.enabled = BLOOM

# smoothed values for the transitions into and out of water
uniform.float.inWater = smooth(if(isEyeInWater == 1, 1.0, 0.0), 0.35, 0.05)
uniform.float.wetLens = smooth(if(isEyeInWater == 1, 1.0, 0.0), 0.05, 1.6)

# ---------------------------------------------------------------- option screen
screen = <profile> <empty> [WATER] [LIGHTING] [SHADOWS] [SKY] [MOTION] [IMAGE]
screen.columns = 2
screen.WATER = WAVE_STRENGTH WAVE_SPEED WATER_DISPLACEMENT WATER_TRANSPARENCY WATER_REFRACTION REFLECTION_QUALITY SSR_STEPS FOAM_INTENSITY CAUSTICS UNDERWATER_FOG
screen.LIGHTING = SUN_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH MIN_LIGHT EMISSIVE_STRENGTH SPECULAR_STRENGTH HANDHELD_LIGHT
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION sunPathRotation
screen.SKY = CLOUD_MODE CLOUD_COVERAGE HAZE_STRENGTH STARS
screen.MOTION = FOLIAGE_MOTION CLOTH_SWAY
screen.IMAGE = EXPOSURE SATURATION CONTRAST BLOOM BLOOM_STRENGTH STYLISATION OUTLINE_STRENGTH VIGNETTE

sliders = shadowMapResolution shadowDistance sunPathRotation SHADOW_SAMPLES SHADOW_SOFTNESS SHADOW_DISTORTION \
    WAVE_STRENGTH WAVE_SPEED WATER_TRANSPARENCY WATER_REFRACTION SSR_STEPS FOAM_INTENSITY UNDERWATER_FOG \
    SUN_STRENGTH AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH MIN_LIGHT EMISSIVE_STRENGTH SPECULAR_STRENGTH \
    CLOUD_COVERAGE HAZE_STRENGTH FOLIAGE_MOTION BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST STYLISATION \
    OUTLINE_STRENGTH VIGNETTE

# ---------------------------------------------------------------- profiles (BALANCED = the defaults)
profile.LOW = shadowMapResolution=1024 shadowDistance=80.0 SHADOW_SAMPLES=4 REFLECTION_QUALITY=0 SSR_STEPS=24 !WATER_DISPLACEMENT !CAUSTICS !BLOOM CLOUD_MODE=1
profile.BALANCED = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=8 REFLECTION_QUALITY=1 SSR_STEPS=24 WATER_DISPLACEMENT CAUSTICS BLOOM CLOUD_MODE=2
profile.HIGH = shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=16 REFLECTION_QUALITY=2 SSR_STEPS=32 WATER_DISPLACEMENT CAUSTICS BLOOM CLOUD_MODE=2
