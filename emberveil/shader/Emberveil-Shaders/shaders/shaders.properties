# Emberveil Shaders - pack properties (Iris / OptiFine format). Original work; see LICENSE.

# Vanilla features we replace or keep
clouds=fancy
oldLighting=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
stars=true
weather=true
separateAo=false

# Data buffers must be written as-is by translucent programs, never alpha-blended.
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_clouds.colortex1=off
blend.gbuffers_weather.colortex1=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_spidereyes.colortex1=off
blend.gbuffers_beaconbeam.colortex1=off
blend.gbuffers_armor_glint.colortex1=off
blend.gbuffers_skybasic.colortex1=off
blend.gbuffers_skytextured.colortex1=off

# Profiles. Every option named here changes real behaviour in the shader code.
# BALANCED equals the defaults in lib/settings.glsl and is the recommended starting point.
profile.PERFORMANCE=shadowMapResolution=1024 shadowDistance=80.0 SHADOW_FILTER=0 !COLORED_SHADOWS !VOLUMETRIC_LIGHT VL_STEPS=6 WATER_REFLECTIONS=1 BLOOM_QUALITY=0
profile.BALANCED=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=1 !COLORED_SHADOWS !VOLUMETRIC_LIGHT VL_STEPS=10 WATER_REFLECTIONS=1 BLOOM_QUALITY=1
profile.HIGH=shadowMapResolution=3072 shadowDistance=192.0 SHADOW_FILTER=2 COLORED_SHADOWS VOLUMETRIC_LIGHT VL_STEPS=12 WATER_REFLECTIONS=2 BLOOM_QUALITY=2

screen=<profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [WATER] [FOLIAGE] [POST]
screen.columns=2
screen.LIGHTING=SUN_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT BLOCKLIGHT_STRENGTH TORCH_WARMTH HANDHELD_LIGHT EMISSIVE_BLOCKS ambientOcclusionLevel sunPathRotation
screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_SOFTNESS COLORED_SHADOWS shadowDistanceRenderMul
screen.ATMOSPHERE=FOG_DENSITY VALLEY_MIST MIST_STRENGTH VOLUMETRIC_LIGHT VL_STRENGTH VL_STEPS
screen.WATER=WATER_WAVES WAVE_STRENGTH WATER_REFLECTIONS WATER_ALPHA UNDERWATER_CLARITY
screen.FOLIAGE=WAVING_PLANTS WAVING_LEAVES WAVING_SPEED WAVING_AMOUNT
screen.POST=BLOOM BLOOM_STRENGTH BLOOM_QUALITY EXPOSURE SATURATION CONTRAST GRADE_STRENGTH VIGNETTE

sliders=SUN_BRIGHTNESS NIGHT_BRIGHTNESS MIN_LIGHT BLOCKLIGHT_STRENGTH TORCH_WARMTH ambientOcclusionLevel sunPathRotation shadowMapResolution shadowDistance SHADOW_SOFTNESS FOG_DENSITY MIST_STRENGTH VL_STRENGTH VL_STEPS WAVE_STRENGTH WATER_ALPHA UNDERWATER_CLARITY WAVING_SPEED WAVING_AMOUNT BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST GRADE_STRENGTH VIGNETTE
