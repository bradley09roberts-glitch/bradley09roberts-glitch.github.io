entries:
  - category: help
    id: controls
    name: Keys at a Glance
    icon: minecraft:oak_button
    priority: true
    sortnum: 0
    pages:
      - text: |
          The keys below show your **current** bindings, so they stay right if you rebind them.

          - Almanac: <key:key.emberveil.open_almanac> (or {/almanac})
          - Accessories: <key:key.curios.open.desc>
          - Backpack: <key:key.sophisticatedbackpacks.open_backpack>
          - World map: <key:gui.xaero_open_map>
          - New waypoint: <key:gui.xaero_new_waypoint>
          - Waypoint list: <key:gui.xaero_waypoints_key>
          - Big minimap: <key:gui.xaero_enlarge_map>
      - title: Combat & gear
        text: |
          - Weapon ability: {Use} (right-click). Optional extra keys: <key:key.simplyswords.mainhand_ability> / <key:key.simplyswords.offhand_ability>
          - Cataclysm item ability: <key:key.cataclysm.ability>
          - Helmet ability: <key:key.cataclysm.helmet_ability>
          - Chestplate ability: <key:key.cataclysm.chestplate_ability>
          - Boots ability: <key:key.cataclysm.boots_ability>
          - Feint (cancel a swing): <key:keybinds.bettercombat.feint>
      - title: Visuals & info
        text: |
          - Toggle shaders: <key:iris.keybind.toggleShaders>
          - Shader menu: <key:iris.keybind.shaderPackSelection>
          - Details on the info overlay: hold <key:key.jade.show_details>
          - Recipe / uses of a hovered item: R / U in any inventory (JEI)

          Change anything in Options > Controls > Key Binds. The search box there also shows conflicts.
    related: [help/controls_notes, utilities/jei, combat/movesets]

  - category: help
    id: controls_notes
    name: Why Some Keys Moved
    icon: minecraft:tripwire_hook
    sortnum: 1
    pages:
      - text: |
          Several mods wanted the same keys. Emberveil ships these defaults so nothing fires twice:

          - Minimap "new waypoint" moved from B to N (B opens your backpack).
          - Cataclysm helmet ability moved from C to X, chestplate from Y to J, boots from V to R.
          - Simply Tooltips' tab cycling moved from G to the ` key (G opens accessories).
      - text: |
          - Iris "reload shaders" is unbound (R shows recipes in inventories).
          - Simply Tooltips' GIF capture is unbound (H opens this book).

          Every one of these can be changed back in Options > Controls > Key Binds. Unbound items that you may want to bind: Better Combat's feint, and the Artifacts toggles (night-vision goggles, magnet, charms).
    related: [help/controls]

  - category: help
    id: almanac
    name: Getting This Book Back
    icon: minecraft:book
    sortnum: 2
    pages:
      - text: |
          You are given one Wayfarer's Almanac the first time you join a world. It is never handed out again, so dying or reloading cannot fill your chests with copies.

          You do not need the item to read it: press <key:key.emberveil.open_almanac> or type {/almanac} (no cheats needed).
      - crafting: emberveil:almanac
        text: Want a copy to carry or give to a friend? Combine any Book with a Torch.
    related: [getting_started/welcome]

  - category: help
    id: shaders
    name: Emberveil Shaders
    icon: minecraft:glowstone
    priority: true
    sortnum: 3
    pages:
      - text: |
          Emberveil ships with its own shader pack, **Emberveil Shaders**, made for this pack: warm golden light, cool shadows, mist in the valleys at dawn and dusk, ember-toned torchlight and clear water.

          It is switched on and set to the **Balanced** profile when you first start. It is purely visual: world generation, combat and loot are the same with or without it.
      - title: Turning it on or off
        text: |
          - Press <key:iris.keybind.toggleShaders> to toggle shaders instantly.
          - Press <key:iris.keybind.shaderPackSelection> (or Options > Video Settings > Shader Packs) to pick a pack.
          - In that screen, {Shader Pack Settings} opens the options; the first line is the **Profile**.

          If the screen ever looks wrong after a driver update, press <key:iris.keybind.toggleShaders> and play without shaders.
    related: [help/shader_profiles, help/performance]

  - category: help
    id: shader_profiles
    name: Shader Profiles
    icon: minecraft:spyglass
    sortnum: 4
    pages:
      - text: |
          Three profiles change real settings:

          **Performance**: 1024 shadow map, 80-block shadows, 4-tap filtering, 4 bloom levels.

          **Balanced** (default): 2048 shadow map, 128-block shadows, 12-tap soft filtering, 6 bloom levels.

          **High**: 3072 shadow map, 192-block shadows, 24-tap filtering, stained-glass tinted light, light shafts and screen-space water reflections.
      - title: Tuning by hand
        text: |
          Inside Shader Pack Settings you can also change: night brightness, cave floor light (it also follows the vanilla Brightness slider), torch warmth, fog and valley mist, waves, waving plants, bloom, exposure and saturation.

          Emberveil Shaders deliberately has no motion blur, film grain, chromatic aberration or depth of field.
    related: [help/shaders, help/performance]

  - category: help
    id: performance
    name: Performance
    icon: minecraft:redstone
    sortnum: 5
    pages:
      - text: |
          Emberveil runs about sixty mods. Good starting points:

          - Give Minecraft **6 GB** of memory (4 GB minimum; 8 GB for the High shader profile at long render distance). In your launcher this is the Java memory or "Max memory" setting.
          - Render distance 8 to 12 chunks, simulation distance 6 to 8.
          - Use the Performance shader profile, or press <key:iris.keybind.toggleShaders>, on laptops and older graphics cards.
      - text: |
          Sodium's Video Settings screen has extra options (under Quality and Performance). Entity Culling and ImmediatelyFast work without any setup.

          Big structures generate in the background the first time you pass near them, so the first minutes in a new area can stutter briefly. That settles once the chunks exist.
    related: [help/shader_profiles, help/troubleshooting]

  - category: help
    id: troubleshooting
    name: Common Problems
    icon: minecraft:barrier
    sortnum: 6
    pages:
      - text: |
          **I lost my things when I died.** They are in your [[systems/gravestones|gravestone]] where you fell. Your {Obituary} lists them and the coordinates.

          **A boss healed after I fell back.** Bosses recover when left alone. See [[bosses/overview]].

          **My compass will not find a structure.** Some only appear in certain biomes or dimensions; the [[places/overview|Places]] pages say where.
      - text: |
          **The game is slow or runs out of memory.** See [[help/performance]].

          **Two keys do the same thing.** Options > Controls > Key Binds shows conflicts in red and has a search box.

          **Shaders look wrong.** Press <key:iris.keybind.toggleShaders>, then try the Performance profile. Your world is unaffected.

          **This book is gone.** See [[help/almanac]].
    related: [help/controls, help/performance]

  - category: help
    id: credits
    name: Credits
    icon: minecraft:name_tag
    sortnum: 7
    pages:
      - text: |
          Emberveil is a curated modpack. The creatures, weapons, structures and systems described in this book come from the mods listed in the pack's attribution file, made by their respective authors.

          Original to Emberveil: this Almanac and its art, the Emberveil Core companion mod (book delivery, keybind, spawn/loot/moveset tuning, Deeds) and Emberveil Shaders.
      - text: |
          Main content mods: Mowzie's Mobs, L_Ender's Cataclysm, Illager Invasion, Mutant Monsters, Naturalist, Simply Swords, Better Combat, Artifacts, Immersive Armors, the YUNG's structure mods, Tectonic, Farmer's Delight, Comforts, Waystones, Sophisticated Backpacks, Gravestone, Explorer's and Nature's Compass, Xaero's maps, JEI, Jade and Patchouli.

          Full list, versions and licences: docs/ATTRIBUTION.md in the pack's source.
