// Emberveil test kit: a development-only mod that scripts the real client for automated checks.
// It is NOT part of the modpack and does nothing unless -Demberveil.testkit=<script> is set.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.0'
group = 'net.emberveil'
base { archivesName = 'emberveil-testkit' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'vazkii.patchouli' } }
}
neoForge {
    version = project.neo_version
    mods { testkit { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE:api"
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
