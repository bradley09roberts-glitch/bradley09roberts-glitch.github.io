# Build, test and smoke-test the CounterCoach companion on a real Windows runner.
# Runs on pushes to the CounterCoach branch that touch countercoach/, or manually
# (Actions → "CounterCoach Windows build" → Run workflow, once this file is on main).
name: CounterCoach Windows build

on:
  workflow_dispatch:
  push:
    branches: [claude/beautiful-keller-fuz66v]
    paths:
      - "countercoach/**"
      - ".github/workflows/countercoach-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: countercoach
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: countercoach/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: countercoach/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build installer and portable zip
        run: pnpm --filter @countercoach/desktop dist:win
      # Upload first so the installer is available even if a later check fails.
      - uses: actions/upload-artifact@v4
        with:
          name: CounterCoach-Windows-installer
          path: |
            countercoach/apps/desktop/release/CounterCoach-Setup-*.exe
            countercoach/apps/desktop/release/CounterCoach-*-win-x64.zip
          if-no-files-found: error
      - run: pnpm typecheck
      - run: pnpm test
      - name: Smoke-launch the unpacked app
        shell: pwsh
        run: |
          $ud = Join-Path $env:RUNNER_TEMP "cc-smoke"
          $env:COUNTERCOACH_SMOKE = "1"
          $env:COUNTERCOACH_USER_DATA = $ud
          $p = Start-Process -FilePath "apps/desktop/release/win-unpacked/CounterCoach.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "app did not exit" }
          $raw = Get-Content (Join-Path $ud "smoke-report.json") -Raw
          $raw
          # The screen reader's capture path (Electron desktopCapturer) must work on Windows.
          $r = $raw | ConvertFrom-Json
          if (-not $r.capture.ok) { throw "screen capture failed: $($r.capture.error)" }
          if ($r.overlayOpacityAfterCapture -lt 0.3) { throw "overlay opacity not restored after capture" }
      - name: Silent install and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/CounterCoach-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs/CounterCoach"
          if (-not (Test-Path (Join-Path $dir "CounterCoach.exe"))) { throw "not installed" }
          Start-Process (Join-Path $dir "Uninstall CounterCoach.exe") -ArgumentList "/currentuser","/S" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir "CounterCoach.exe")) { throw "not uninstalled" }
          "install/uninstall OK"
