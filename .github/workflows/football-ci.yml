name: football-ci

on:
  push:
    paths: ["football/**", ".github/workflows/football-ci.yml"]
  pull_request:
    paths: ["football/**", ".github/workflows/football-ci.yml"]

defaults:
  run:
    working-directory: football

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: football/frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: npm ci
        working-directory: football/frontend
      - run: npm run typecheck && npm run build
        working-directory: football/frontend
